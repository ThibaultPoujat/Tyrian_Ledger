name: Publish static Pages snapshot

on:
  push:
    branches: [develop]
  schedule:
    # Every 15 minutes in UTC. GitHub may delay scheduled runs under high load.
    - cron: '0,15,30,45 * * * *'

concurrency:
  group: pages-publication
  cancel-in-progress: true

permissions: {}

jobs:
  resolve-source:
    if: github.ref == 'refs/heads/develop'
    name: Resolve reviewed source selector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_kind: ${{ steps.selector.outputs.source_kind }}
      source_sha: ${{ steps.selector.outputs.source_sha }}
    steps:
      - name: Checkout trusted develop workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'

      - id: selector
        name: Validate the reviewed immutable selector
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/resolve-pages-source.mjs
          --config .github/pages-preview-selector.json
          --repository "$GITHUB_REPOSITORY"
          --base-branch develop
          --develop-sha "$GITHUB_SHA"
          --output "$GITHUB_OUTPUT"

  build-static-candidate:
    if: github.ref == 'refs/heads/develop'
    needs: resolve-source
    name: Capture and build static candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout selected immutable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate complete public market snapshot
        run: >-
          dotnet run --project src/Gw2Tp.MarketSnapshotGenerator --
          --output "$RUNNER_TEMP/market-snapshot.json"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React assets against this snapshot revision
        shell: bash
        run: |
          snapshot_hash="$(sha256sum "$RUNNER_TEMP/market-snapshot.json" | cut -d ' ' -f1)"
          repository_name="${GITHUB_REPOSITORY#*/}"
          echo "VITE_SITE_BASE_PATH=/${repository_name}/" >> "$GITHUB_ENV"
          echo "VITE_MARKET_SNAPSHOT_PATH=market-snapshot.json?revision=${snapshot_hash}" >> "$GITHUB_ENV"
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run build

      - name: Assemble static artifact
        run: >-
          node .github/scripts/assemble-pages-artifact.mjs
          --dist frontend/dist
          --snapshot "$RUNNER_TEMP/market-snapshot.json"
          --output "$RUNNER_TEMP/pages-candidate"

      - name: Upload candidate for trusted audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: pages-candidate
          path: ${{ runner.temp }}/pages-candidate
          retention-days: 1

  audit-static-candidate:
    if: github.ref == 'refs/heads/develop'
    needs: build-static-candidate
    name: Audit static candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted develop audit code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'

      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-candidate
          path: ${{ runner.temp }}/pages-candidate

      - name: Enforce static-artifact policy
        run: node .github/scripts/audit-pages-artifact.mjs "$RUNNER_TEMP/pages-candidate"

  deploy-pages:
    if: github.ref == 'refs/heads/develop'
    needs: audit-static-candidate
    name: Deploy audited static candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted develop deployment code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'

      - name: Download audited candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-candidate
          path: ${{ runner.temp }}/pages-candidate

      - name: Repeat static-artifact policy check before deployment
        run: node .github/scripts/audit-pages-artifact.mjs "$RUNNER_TEMP/pages-candidate"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages-candidate
          retention-days: 1

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
